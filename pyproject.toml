[build-system]
requires = ['setuptools>=69', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'ragmens-core'
version = '0.3.0'
description = 'Libreria RAG modulare con Docling, Qwen, Qdrant e Ollama'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = ['docling>=2.0,<3', 'ftfy>=6.2,<7', 'transformers>=4.51,<5', 'sentence-transformers>=4.1,<6', 'accelerate>=1,<2', 'torch>=2.2', 'numpy>=1.26,<2', 'qdrant-client>=1.12,<2', 'ollama>=0.4,<1', 'python-dotenv>=1,<2']

[project.optional-dependencies]
api = ['fastapi>=0.115', 'uvicorn>=0.30']
test = ['pytest>=8', 'httpx>=0.27']
notebook = ['jupyterlab>=4']

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']
markers = ['integration: richiede modelli reali o servizi esterni']
